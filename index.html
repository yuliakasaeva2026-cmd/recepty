<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Книга рецептов</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рецепты">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1219" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: controls stacked like a recipe card on the left; the result sits in an "enamel dish" on the right; one column on phones */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#EAEDF3; --ink:#1A2132; --muted:#596277; --line:#D6DCE6;
  --cobalt:#2846A3; --cobalt-soft:#E4E9F7; --crust:#93590F; --crust-soft:#F5E8D2;
  --warn:#A3441C; --warn-soft:#FAE6DC; --ok:#25693F; --ok-soft:#DFF0E5; --shadow:rgba(26,33,50,.12);
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1219; --surface:#171B25; --sunk:#11151D; --ink:#E7EAF1; --muted:#98A1B4; --line:#2A3142;
    --cobalt:#93AAF2; --cobalt-soft:#1D2742; --crust:#E2A851; --crust-soft:#30261A;
    --warn:#F0916B; --warn-soft:#34211A; --ok:#72CC97; --ok-soft:#15291E; --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1219; --surface:#171B25; --sunk:#11151D; --ink:#E7EAF1; --muted:#98A1B4; --line:#2A3142;
  --cobalt:#93AAF2; --cobalt-soft:#1D2742; --crust:#E2A851; --crust-soft:#30261A;
  --warn:#F0916B; --warn-soft:#34211A; --ok:#72CC97; --ok-soft:#15291E; --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--crust);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.05;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:62ch}
.grid{display:grid;gap:18px;margin-top:20px}
@media (min-width:880px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .result{position:sticky;top:calc(16px + env(safe-area-inset-top, 0px))}
}
.panel,.result{display:flex;flex-direction:column;gap:14px;min-width:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:8px 6px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;text-align:center;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px var(--shadow),0 0 0 1px var(--line);font-weight:600}
.seg-s{font-size:12px;color:var(--muted);font-weight:400}
.seg.mini button{font-size:13px;padding:5px 8px}
.chip{display:inline-block;font-size:11px;font-weight:600;color:var(--crust);background:var(--crust-soft);border-radius:999px;padding:1px 8px;white-space:nowrap;letter-spacing:.01em;vertical-align:1px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.labrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.inrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1 1 140px;min-width:0}
.num:focus-within{outline:2px solid var(--cobalt);outline-offset:1px}
.num input{font-family:var(--f-num);font-size:19px;font-weight:500;width:100%;min-width:0;border:0;background:transparent;color:var(--ink);padding:9px 0;font-variant-numeric:tabular-nums;outline:none}
.num span{color:var(--muted);font-family:var(--f-num)}
.num.user{border-color:var(--cobalt);background:var(--cobalt-soft)}
.state{font-size:13px;color:var(--muted);margin:0}
.state b{color:var(--ink);font-weight:600;font-family:var(--f-num);font-size:13px}
.reset,.quick button,.ghost{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--cobalt);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.reset:hover,.quick button:hover,.ghost:hover{border-color:var(--cobalt)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num input:focus-visible{outline:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-family:var(--f-num);color:var(--ink)}
.quick button[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt)}
.err{font-size:13px;color:var(--warn);margin:0}
.blends{display:flex;flex-direction:column;gap:6px}
.blend{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.blend input{accent-color:var(--cobalt);margin:4px 0 0;flex:none}
.blend.on{border-color:var(--cobalt);background:var(--cobalt-soft)}
.blend-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.blend-name{font-weight:600}
.blend small{color:var(--muted);font-size:13px}
.flourfields{display:grid;gap:12px}
@media (min-width:520px){.flourfields.two,.flourfields.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.flourfields.two .field:last-child{grid-column:1 / -1}}
.blend-group{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:8px 0 0}
.blend-group:first-child{margin-top:0}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{accent-color:var(--cobalt);margin:4px 0 0;flex:none;width:16px;height:16px}
.check small{display:block;color:var(--muted);font-size:13px}
.check-g{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.dish{background:var(--surface);border:2px solid var(--cobalt);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 24px -12px var(--shadow)}
.dish-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:1px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ing li:last-child{border-bottom:0}
.ing-n{min-width:0}
.ing-q{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ing-s{grid-column:1 / -1;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.delta{font-family:var(--f-num);color:var(--cobalt)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{font-size:14px;border-radius:10px;padding:9px 12px;background:var(--cobalt-soft)}
.notes li.warn{background:var(--warn-soft)}
.notes:empty{display:none}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.facts dt{color:var(--muted);font-size:13px;padding-top:1px}
.facts dd{margin:0;min-width:0}
.kbju{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.kbju div{background:var(--sunk);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.kbju b{display:block;font-family:var(--f-num);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.kbju span{font-size:12px;color:var(--muted)}
.steps ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px}
.steps li{padding-left:4px}
.steps li::marker{font-family:var(--f-num);color:var(--cobalt)}
.steps b{font-weight:600}
footer{margin-top:18px}
.seg.seg-wrap{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--cobalt);font:inherit;font-size:22px;line-height:1;cursor:pointer}
.stepper output{font-family:var(--f-num);font-size:20px;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.ing .grp{display:block;border-bottom:0;padding:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ing .grp:first-child{padding-top:0}
@media (prefers-reduced-motion:no-preference){.blend,.num,.seg button{transition:background-color .15s,border-color .15s}}

/* ---- книга ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.appbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{box-sizing:border-box;width:100%;max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;min-height:52px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:40px;height:40px;border:0;background:transparent;color:var(--cobalt);border-radius:10px;cursor:pointer;font:inherit;font-size:15px;padding:0 6px}
.icon-btn svg{width:24px;height:24px}
.icon-btn:hover{background:var(--cobalt-soft)}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--ink);text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star-btn[aria-pressed="true"]{color:var(--crust)}
.view{display:block}
.home-head{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:16px}
.searchbox:focus-within{outline:2px solid var(--cobalt);outline-offset:1px}
.searchbox svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbox input{font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);padding:11px 0;width:100%;min-width:0;outline:none}
.sec-h{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.15;margin:26px 0 12px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);min-height:96px;min-width:0}
.tile:hover{border-color:var(--cobalt)}
.tile-count{font-family:var(--f-num);font-size:26px;line-height:1;color:var(--cobalt);font-variant-numeric:tabular-nums}
.tile.empty .tile-count{color:var(--line)}
.tile-name{font-weight:600;line-height:1.25}
.tile-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--cobalt)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-title{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;text-wrap:balance}
.card-star{color:var(--crust);flex:none;margin-top:2px}
.card-star svg{width:18px;height:18px}
.card-sum{color:var(--muted);font-size:14px;margin:0}
.card-meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.pp{background:var(--ok-soft);color:var(--ok)}
.tag.calc{background:var(--cobalt-soft);color:var(--cobalt)}
.empty-state{border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty-state b{color:var(--ink);font-weight:600}
.page-foot{margin-top:28px;color:var(--muted);font-size:13px}
.r-head{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.r-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.r-grid{display:grid;gap:18px;margin-top:18px}
@media (min-width:880px){.r-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--cobalt);font:inherit;font-size:22px;line-height:1;cursor:pointer}
.stepper output{font-family:var(--f-num);font-size:20px;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.ing .grp{display:block;border-bottom:0;padding:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.r-notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tool-ic{color:var(--cobalt);line-height:0}
.tool-ic svg{width:30px;height:30px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.dish-link{color:var(--ink);text-decoration:none}
.dish-link:hover{color:var(--cobalt);text-decoration:underline}
.select{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink)}
.select:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
.net-box{gap:6px}
.net{font-family:var(--f-num);font-weight:500;font-size:44px;line-height:1.1;color:var(--cobalt);margin:0;font-variant-numeric:tabular-nums}
.page-foot a{color:var(--cobalt)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{font:inherit;font-size:13px;line-height:1.3;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.preset b{font-family:var(--f-num);font-weight:500;color:var(--ok)}
.preset:hover{border-color:var(--ok)}
.preset[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.chip.ok-chip{color:var(--ok);background:var(--ok-soft)}
.blend.bad .blend-name{color:var(--muted)}
.bad-word{color:var(--warn);font-weight:600}
.pill.new{color:var(--cobalt);background:var(--cobalt-soft)}
.pill.tweak{color:var(--crust);background:var(--crust-soft)}
.dish > .check{background:var(--crust-soft);border-radius:10px;padding:10px 12px}
.dish > .check small{display:block;color:var(--muted)}
#vAppleBlock .seg + .seg{margin-top:8px}
.notes li b{font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.seg.seg-wrap{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
.notes li.spice{background:var(--sunk)}
#vSlots{gap:14px}
#vSlots .seg + .seg{margin-top:8px}
@media (min-width:880px){.result{top:calc(68px + env(safe-area-inset-top, 0px))}}
.memo .ing-q{white-space:normal;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.memo .ing-q span{white-space:nowrap}
.memo .ing-n{font-weight:500}
.sub-h{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.15;margin:12px 0 0}
#cLoose,#cOpts{gap:14px}
#cLoose:empty,#cOpts:empty{display:none}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <button type="button" class="icon-btn" id="backBtn" aria-label="Назад" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <a class="brand" href="#" id="brand">Книга рецептов</a>
    <button type="button" class="icon-btn star-btn" id="starBtn" aria-label="В избранное" aria-pressed="false" hidden></button>
  </div>
</header>
<main class="wrap view" id="view"></main>

<script src="recipes.js"></script>
<script src="calc-zapekanka.js"></script>
<script src="calc-vafli.js"></script>
<script src="calc-recept.js"></script>
<script>
(function(){
  var BOOK = window.BOOK || { sections:[], recipes:[] };
  var MODS = window.RecipeModules || {};
  var byId = {}; BOOK.recipes.forEach(function(r){ byId[r.id] = r; });
  var secById = {}; BOOK.sections.forEach(function(s){ secById[s.id] = s; });
  var view = document.getElementById('view');
  var STAR_O = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  var STAR_F = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
  var SEARCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function plural(n, w){ var a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? w[0] : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? w[1] : w[2]; }
  function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
  var favs = store('book-favs') || [];
  function isFav(id){ return favs.indexOf(id) >= 0; }
  function toggleFav(id){ if (isFav(id)) favs = favs.filter(function(x){ return x !== id; }); else favs.push(id); store('book-favs', favs); }

  function fmtNum(v){ return String(v).replace('.', ','); }

  function frac(v, step){
    var r = Math.round(v / step) * step; if (r <= 0) r = step;
    var whole = Math.floor(r + 1e-9), part = Math.round((r - whole) * 100) / 100;
    if (!part) return String(whole);

  function qty(i, f){

    }
    if (u === 'г' || u === 'мл') return (v < 10 ? fmtNum(Math.round(v * 10) / 10) : Math.round(v)) + ' ' + u;
    if (u === 'кг' || u === 'л') return fmtNum(Math.round(v * 100) / 100) + ' ' + u;

      else if (h === 'posuda'){ posuda(); page = 'posuda'; }
      else if (h === 'temp' && BOOK.doneness){ temp(); page = 'temp'; }
      else if (h === 'vremya' && BOOK.cooking){ vremya(); page = 'vremya'; }
      else if (h === 'ves'){ ves(); page = 'ves'; }
      else if ((m = /^ves-(.+)$/.exec(h))){ ves(m[1]); page = 'ves'; }
      else home();
    }
    backBtn.hidden = page === 'home';
    window.scrollTo(0, isBack && scrolls[h] ? scrolls[h] : 0);
  }
  window.addEventListener('scroll', function(){ scrolls[location.hash.replace(/^#/, '')] = window.scrollY; }, { passive: true });
  backBtn.addEventListener('click', function(){ if (stack.length > 1) history.back(); else location.hash = ''; });
  brand.addEventListener('click', function(e){ if (!location.hash || location.hash === '#'){ e.preventDefault(); window.scrollTo(0, 0); } });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){} });
}
</script>
